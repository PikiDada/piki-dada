# Piki Dada on the shared server (github.com/arihosolomon/hetzner-box): the front door
# (HTTPS) and Postgres are shared and live there, not here. This file is everything that is
# Piki Dada's own. Deployed with `bin/deploy.sh pikidada` from the box repo, which runs
# `docker compose -p pikidada up -d --build --wait`. See deploy/README.md.
name: pikidada

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the driver-documents bucket and makes it anonymously readable, since
  # uploads.service.ts hands back plain (unsigned) URLs that the admin UI loads directly as
  # <img src>. Runs once per `docker compose up` and exits; safe to re-run (mc mb -p / repeat
  # anonymous-set are both idempotent).
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    # The $ variables below are read inside the container, so they must be passed in here.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET:-driver-documents} &&
      mc anonymous set download local/${MINIO_BUCKET:-driver-documents}
      "

  # No self-hosted mail container here -- email goes through Amazon SES (see
  # apps/api/.env.example's SMTP_* section). SES is reached over the public internet
  # regardless of where this stack runs, so it needs no service in this compose file and no
  # reconfiguration when this moves between hosts.

  # Self-hosted road-distance/duration routing (free, no per-request cost). Only the maps
  # service talks to it; Piki Dada asks the maps service. Deliberately NOT wired into
  # anything's `depends_on`: pricing falls back to Google Routes (or a straight-line estimate)
  # if this is absent or down, so it's fine to bring the rest of the stack up before this is
  # ready.
  #
  # deploy/osrm/run.sh applies the speeds the maps service learns from real trips
  # (/traffic/speeds.csv) once a day, and serves with --mmap so the routing data is read from
  # disk on demand rather than held entirely in memory.
  #
  # Unlike every other service here, this one needs a one-time (or periodic, if you want
  # fresher map data later) data-preparation step BEFORE it can serve anything -- osrm-routed
  # refuses to start without a pre-processed .osrm dataset, and producing one from a raw OSM
  # extract takes real time/disk/CPU, so it's deliberately not automated into a `depends_on`
  # init container the way minio-init is. Run once on the server, from this repo's root:
  #
  #   docker volume create pikidada_osrm_data
  #   curl -L -o uganda-latest.osm.pbf https://download.geofabrik.de/africa/uganda-latest.osm.pbf
  #   docker run -t -v "$(pwd):/data" -v pikidada_osrm_data:/output ghcr.io/project-osrm/osrm-backend:v26.10.0-debian \
  #     osrm-extract -p /opt/car.lua /data/uganda-latest.osm.pbf
  #   mv uganda-latest.osrm* /var/lib/docker/volumes/pikidada_osrm_data/_data/ 2>/dev/null || true
  #   docker run -t -v pikidada_osrm_data:/data ghcr.io/project-osrm/osrm-backend:v26.10.0-debian \
  #     osrm-partition /data/uganda-latest.osrm
  #   docker run -t -v pikidada_osrm_data:/data ghcr.io/project-osrm/osrm-backend:v26.10.0-debian \
  #     osrm-customize /data/uganda-latest.osrm
  #
  # (osrm-extract's exact output-path handling varies by image version -- check what lands
  # where before the mv step; simplest is often to run osrm-extract with /data mounted
  # directly to the same volume osrm-routed will read from, skipping the copy entirely.)
  # The car profile is intentional, not a placeholder: OSRM ships no motorcycle profile, and
  # the speeds learned from real boda trips correct it where it matters.
  #
  # Off until that data exists: without it osrm-routed exits, restarts forever, and every
  # deploy (which waits for all services to be healthy) would report failure. Once the data
  # is prepared, add COMPOSE_PROFILES="routing" to .env and deploy again.
  #
  # The image is the project's own, on GitHub's registry (the Docker Hub copy is no longer
  # updated), pinned so a new release can't change routing under us.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    profiles: ["routing"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/run.sh"]
    mem_limit: 1536m
    volumes:
      - osrm_data:/data
      - osrm_traffic:/traffic:ro
      - ./deploy/osrm/run.sh:/run.sh:ro

  # The independent maps platform (services/maps, Go). Piki Dada sends it GPS traces and
  # chosen addresses, and asks it for routes; it learns road speeds from the traces and
  # writes them to /traffic for the osrm service. Keeps its own `maps` database in the same
  # Postgres server, created on first start. Internal only: not exposed through Caddy.
  maps:
    build:
      context: services/maps
    restart: unless-stopped
    mem_limit: 128m
    # Its database (pikidada_maps) and the login are created by the box's bin/add-app.sh.
    environment:
      PGHOST: postgres
      PGUSER: pikidada
      PGPASSWORD: ${PIKIDADA_DB_PASSWORD:?set PIKIDADA_DB_PASSWORD in .env}
      PGDATABASE: pikidada_maps
      PGSSLMODE: disable
      OSRM_URL: http://osrm:5000
      API_TOKEN: ${MAPS_PLATFORM_TOKEN:?set MAPS_PLATFORM_TOKEN in .env}
    volumes:
      - osrm_traffic:/traffic
    networks:
      - default
      - db
    healthcheck:
      test: ["CMD", "/mapsd", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - apps/api/.env
    environment:
      # Fixed here because the Caddyfile and the healthcheck below both expect 4001.
      PORT: "4001"
      MAPS_PLATFORM_URL: http://maps:8080
      MAPS_PLATFORM_TOKEN: ${MAPS_PLATFORM_TOKEN}
      # Caps the JS heap below the container limit, so Node collects garbage instead of
      # growing until the container is killed.
      NODE_OPTIONS: --max-old-space-size=256
    # DATABASE_URL in apps/api/.env points at postgres:5432 on the shared `db` network.
    networks:
      - default
      - db
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no wget/curl; Node's built-in fetch does the same check.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # The one service facing the internet (the box's front door sends every Piki Dada domain
  # here, over the `edge` network, as plain HTTP). Its Caddyfile serves the website, built as
  # plain files into this image (apps/web/Dockerfile), and routes api. and files. to the API
  # and MinIO.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        # Map display switch; unset means Google. See deploy/README.md.
        NEXT_PUBLIC_MAP_PROVIDER: ${NEXT_PUBLIC_MAP_PROVIDER:-}
        NEXT_PUBLIC_MAP_TILES_URL: ${NEXT_PUBLIC_MAP_TILES_URL:-}
        NEXT_PUBLIC_MAP_GLYPHS_URL: ${NEXT_PUBLIC_MAP_GLYPHS_URL:-}
        NEXT_PUBLIC_MAP_SPRITE_URL: ${NEXT_PUBLIC_MAP_SPRITE_URL:-}
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Map tiles (.pmtiles) for our own map display, served at /tiles/*; see the Caddyfile
      # and deploy/README.md. Empty unless you've put a file there.
      - ./data/tiles:/srv/tiles:ro
    networks:
      default:
      edge:
        aliases:
          - pikidada
    depends_on:
      - api
      - minio
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  osrm_data:
  osrm_traffic:

networks:
  default:
  # Shared, created by the box's bin/setup-server.sh.
  edge:
    external: true
  db:
    external: true
