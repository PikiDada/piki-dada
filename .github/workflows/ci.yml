name: CI

on:
  pull_request:
  push:
    branches: [main]

# pnpm's version comes from package.json's "packageManager" field. Also passing `version:`
# to pnpm/action-setup made every run fail at setup ("Multiple versions of pnpm specified").

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api build
      # Lint without --fix (the package's own "lint" script fixes files), so CI reports
      # problems instead of silently rewriting a throwaway checkout.
      - run: pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts"
      # Unit tests only: they need no database. The e2e suite runs against a real database.
      - run: pnpm --filter api test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      # The site ships as a static export; catches anything that breaks it (e.g. a page that
      # needs a server).
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: https://api.pikidada.com

  maps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/maps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/maps/go.mod
          cache-dependency-path: services/maps/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  # The Hetzner stack: proves the three images build and the Caddyfile parses, so the first
  # time they're built isn't on the server during the move.
  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci-password
      MAPS_PLATFORM_TOKEN: ci
      NEXT_PUBLIC_API_URL: https://api.pikidada.com
    steps:
      - uses: actions/checkout@v4
      - run: touch apps/api/.env
      - run: docker compose config --quiet
      - run: docker compose build api maps caddy
      - run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
