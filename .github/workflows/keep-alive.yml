name: Keep API and DB warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Pings the production domain rather than a Render hostname, so it always reaches
      # whichever service api.pikidada.com points at. The live service's Render address is
      # piki-dada-api-xgen.onrender.com (the dashboard names it "piki-dada-api"); a different,
      # outdated service at piki-dada-api.onrender.com held the domain until 7 Oct 2026.
      - name: Ping /health
        run: curl -sf --max-time 180 --retry 3 --retry-all-errors https://api.pikidada.com/health
